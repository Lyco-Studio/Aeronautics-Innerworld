configurations {
    modDistributions {
        canBeConsumed = false
        canBeResolved = true
    }
    implementation.extendsFrom modDistributions
}

def embeddedModDependencies = layout.buildDirectory.dir('dependencies/embedded')
def extractEmbeddedModDependencies = tasks.register('extractEmbeddedModDependencies', Sync) {
    from({ configurations.modDistributions.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into embeddedModDependencies
}

dependencies {
    modDistributions("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    modDistributions("maven.modrinth:sable:${sable_version}") {
        transitive = false
    }
    modDistributions("maven.modrinth:create-aeronautics:${aeronautics_version}") {
        transitive = false
    }

    // Nested modules and API libraries need separate compile classpath entries.
    // NeoForge loads them from the original distributions at runtime.
    compileOnly files(embeddedModDependencies.map { directory ->
        fileTree(directory) { include '*.jar' }
    }).builtBy(extractEmbeddedModDependencies)
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        create_mod_version: create_mod_version,
        aeronautics_mod_version: aeronautics_mod_version,
        sable_mod_version: sable_mod_version,
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask extractEmbeddedModDependencies

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
    }
}
