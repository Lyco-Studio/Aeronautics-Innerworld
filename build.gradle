tasks.named('runCombatTestClient') {
    def result = layout.projectDirectory.file('run/client/combat-check.result')
    doFirst {
        if (!file("run/client/saves/${clientCheckWorld}/level.dat").isFile()) {
            throw new GradleException('Create a development world first, then select it with -PcheckWorld=<world folder>.')
        }
        result.asFile.delete()
    }
    doLast {
        if (!result.asFile.isFile() || result.asFile.text != 'verified') {
            throw new GradleException('Combat client check failed; inspect the client diagnostics.')
        }
    }
}
