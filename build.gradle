plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'idea'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom implementation
    integrationTestCompileOnly.extendsFrom compileOnly
}

def prepareIntegrationStructures = tasks.register('prepareIntegrationStructures', Copy) {
    from 'src/integrationTest/structures'
    into 'run/integration/gameteststructures'
}

// GameTestServer builds dimensions from the flat preset instead of datapack level stems.
def generateIntegrationWorldPreset = tasks.register('generateIntegrationWorldPreset') {
    def mantleDefinition = layout.projectDirectory.file('src/main/resources/data/aeronautics_innerworld/dimension/mantle.json')
    def destination = layout.buildDirectory.dir('generated/integrationResources')
    def coreDefinition = layout.projectDirectory.file('src/main/resources/data/aeronautics_innerworld/dimension/core.json')
    inputs.file coreDefinition
    inputs.file mantleDefinition
    outputs.dir destination
    doLast {
        def flatSettings = [biome: 'minecraft:plains', features: false, lakes: false, structure_overrides: [],
                layers: [[height: 1, block: 'minecraft:bedrock'], [height: 2, block: 'minecraft:dirt'],
                         [height: 1, block: 'minecraft:grass_block']]]
        def dimensions = [
                'minecraft:overworld': [type: 'minecraft:overworld', generator: [type: 'minecraft:flat', settings: flatSettings]],
                'minecraft:the_nether': [type: 'minecraft:the_nether', generator: [type: 'minecraft:noise', settings: 'minecraft:nether',
                        biome_source: [type: 'minecraft:multi_noise', preset: 'minecraft:nether']]],
                'minecraft:the_end': [type: 'minecraft:the_end', generator: [type: 'minecraft:noise', settings: 'minecraft:end',
                        biome_source: [type: 'minecraft:the_end']]],
                'aeronautics_innerworld:mantle': new groovy.json.JsonSlurper().parse(mantleDefinition.asFile),
                'aeronautics_innerworld:core': new groovy.json.JsonSlurper().parse(coreDefinition.asFile)]
        def target = destination.get().file('data/minecraft/worldgen/world_preset/flat.json').asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([dimensions: dimensions])) + '\n'
    }
}
sourceSets.integrationTest.resources.srcDir(generateIntegrationWorldPreset.map {
    layout.buildDirectory.dir('generated/integrationResources').get()
})

repositories {
    mavenCentral()
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.integrationTest)
def integrationMod = neoForge.mods.create("${mod_id}_checks") {
    sourceSet sourceSets.integrationTest
}
neoForge.runs.configureEach {
    loadedMods.set([neoForge.mods.getByName(mod_id)])
}
neoForge.runs.create('integrationTestServer') {
    type = 'gameTestServer'
    sourceSet = sourceSets.integrationTest
    gameDirectory = project.file('run/integration')
    loadedMods.add(integrationMod)
    systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    taskBefore prepareIntegrationStructures
}
tasks.named('runIntegrationTestServer') {
    doFirst {
        delete layout.projectDirectory.dir('run/integration/world')
    }
}
neoForge.runs.create('lifecycleTestServer') {
    server()
    sourceSet = sourceSets.integrationTest
    gameDirectory = project.file('run/lifecycle')
    loadedMods.add(integrationMod)
    programArgument '--nogui'
    systemProperty 'innerworld.lifecycleCheck', 'true'
}
tasks.named('runLifecycleTestServer') {
    def result = layout.projectDirectory.file('run/lifecycle/lifecycle-check.result')
    doFirst {
        copy {
            from 'src/integrationTest/lifecycle-server.properties'
            into 'run/lifecycle'
            rename { 'server.properties' }
        }
        result.asFile.delete()
    }
    doLast {
        if (!result.asFile.isFile() || !(result.asFile.text in ['prepared', 'working', 'verified'])) {
            throw new GradleException('Drill lifecycle check failed; inspect the server diagnostics.')
        }
        logger.lifecycle("Drill lifecycle phase completed: ${result.asFile.text}")
    }
}
