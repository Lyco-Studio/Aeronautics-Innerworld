}
tasks.named('runRecoveryTestClient') {
    def result = layout.projectDirectory.file('run/client/recovery-check.result')
    doFirst {
        if (!file("run/client/saves/${clientCheckWorld}/level.dat").isFile()) {
            throw new GradleException('Create a development world first, then select it with -PcheckWorld=<world folder>.')
        }
        result.asFile.delete()
    }
    doLast {
        def expected = Boolean.parseBoolean(providers.gradleProperty('recoveryEntry').getOrElse('false')) ? 'entry-verified' : 'verified'
        if (!result.asFile.isFile() || result.asFile.text != expected) {
            throw new GradleException('Recovery client check failed; inspect the client diagnostics.')
        }
    }
}
